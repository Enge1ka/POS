<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket POS - Inventory</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional styles for inventory page */
        #inventoryContainer {
            display: flex;
            gap: 20px;
            flex-wrap: wrap; /* Allow wrapping for smaller screens */
        }
        #productListSection, #productFormSection {
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            min-width: 300px; /* Minimum width before wrapping */
        }
        #productFormSection h2 {
            margin-top: 0;
        }
        #productTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        #productTable th, #productTable td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        #productTable th {
            background-color: #f2f2f2;
        }
        #productTable tr:hover {
            background-color: #f9f9f9;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 10px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: calc(100% - 16px); /* Account for padding */
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .button-group button {
            margin-right: 5px;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-save { background-color: #28a745; color: white; }
        .btn-delete { background-color: #dc3545; color: white; }
        .btn-clear { background-color: #ffc107; color: black; }
        .btn-new { background-color: #007bff; color: white; }
        #userMessages { margin-top: 15px; }
        .message { padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        .message.success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .message.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Sales</a></li>
                <li><a href="returns.html">Returns</a></li>
                <li><a href="inventory.html">Inventory</a></li>
                <li><a href="reports.html">Reports</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Inventory Management</h1>
        <div id="userMessages"></div>
        <div id="inventoryContainer">
            <section id="productListSection">
                <h2>Product List</h2>
                <table id="productTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Stock</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                        <!-- Product rows will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </section>
            <section id="productFormSection">
                <h2>Product Form</h2>
                <form id="productForm">
                    <input type="hidden" id="productId" name="productId">
                    <div class="form-group">
                        <label for="productName">Product Name:</label>
                        <input type="text" id="productName" name="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Price:</label>
                        <input type="number" id="productPrice" name="productPrice" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="productStock">Stock Quantity:</label>
                        <input type="number" id="productStock" name="productStock" step="1" min="0" required>
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn-save">Save Product</button>
                        <button type="button" id="clearFormButton" class="btn-clear">Clear Form / New</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 Supermarket POS</p>
    </footer>
    <script src="inventory.js"></script>
</body>
</html>
